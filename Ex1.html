<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cards</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        .container{
            background-color:#999;
            padding:20px 100px;
        }

        .card{
            background-color:white;
            border-radius:10px;
            padding:20px;
            margin-bottom:30px;
        }

        .card p{
            margin-bottom:20px;
            font-size:18px;
        }

        .btn{
            border:none;
            color:white;
            padding:10px 15px;
            border-radius:20px;
            cursor:pointer;
        }

        .green{
            background-color:#008b8b;
        }

        .orange{
            background-color:#f4a300;
            color:black;
        }

        .purple{
            background-color:purple;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card">
            <p>
                Keep track of daily activities can boost productivity and,
                thus, reduce anxiety.
            </p>

            <button class="btn green">
                Read more >>
            </button>
        </div>

        <div class="card">
            <p>
                Have a roadmap, reducing distractions,
                overwhelm or stress
            </p>

            <button class="btn orange">
                Read more >>
            </button>
        </div>

        <div class="card">
            <p>
                Write a to-do list to give you significant control
                over how your day will look.
            </p>

            <button class="btn purple">
                Read more >>
            </button>
        </div>

    </div>

</body>
</html>
