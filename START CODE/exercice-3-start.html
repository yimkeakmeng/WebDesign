<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Flexbox</title>

    <style>
        body {
            margin: 0;
            padding: 1em;
            font-family: Arial, sans-serif;
        }

        /* Main layout */
        .container {
            width: 60em;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        /* Header */
        .header {
            background-color: #1e90ff;
            box-shadow: 0 4px #0077ea;
            border-radius: 0.5em;
            padding: 1em;
            color: white;
            font-size: 1em;
            font-weight: bold;
            /* min-height: 4em; */
        }

        /* Middle section */
       .content {
            display: flex;
            gap: 1em;
        }

        /* Main section */
        .main {
            background-color: #3cb371;
            box-shadow: 0 4px #2f8d59;
            border-radius: 0.5em;
            padding: 1em;
            color: white;
            flex: 1;
            min-width: 0;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 1em;
        }

        .main-title {
            flex-basis: 100%;
            font-size: 1em;
            font-weight: bold;
        }


        /* Item boxes */
        .item {
            background-color: #2f8d59;
            box-shadow: 0 3px #226741;
            border-radius: 0.5em;
            padding: 1em;

            flex: 0 0 20%;
            width: 2em;
            height: 2em;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 1em;
            font-weight: bold;
        }

        /* Sidebar */
        .sidebar {
            background-color: #ff6347;
            box-shadow: 0 4px #e02200;
            border-radius: 0.5em;
            padding: 1em;
            color: white;
            font-size: 1em;
            font-weight: bold;
            flex: 0 0 20%;
        }

        /* Footer */
        .footer {
            background-color: #4169e1;
            box-shadow: 0 4px #1d44b8;
            border-radius: 0.5rem;
            padding: 1rem;
            color: white;
            font-size: 1em;
            font-weight: bold;
            height: 4em;
        }

        /* Responsive layout */
        @media (max-width: 600px) {
            .content {
                flex-direction: column;
            }

            .sidebar {
                flex-basis: auto;
                min-height: 5em;
            }

            .main {
                min-height: 12em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            header
        </header>

        <div class="content">

            <main class="main">
                <div class="main-title">main</div>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </main>

            <aside class="sidebar">
                sidebar
            </aside>

        </div>

        <footer class="footer">
            footer
        </footer>

    </div>
</body>
</html>
